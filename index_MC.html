 + 1$, find and simplify the composite function $(g \\circ f)(x)$:", "options": ["-8x + 7", "-8x + 24", "-8x + 25", "8x + 25"], "correct": 2, "solution": "$g(f(x)) = 4(-2x + 6) + 1 = -8x + 24 + 1 = -8x + 25$"}, {"id": 8, "topic": "Question 8", "question": "For the linear function $f(x) = 8x - 5$, find and simplify the difference quotient $\\frac{f(x+h) - f(x)}{h}$ ($h \\neq 0$):", "options": ["8h", "8x - 5", "\\frac{8h - 10}{h}", "8"], "correct": 3, "solution": "$\\frac{8(x+h)-5 - (8x-5)}{h} = \\frac{8h}{h} = 8$"}, {"id": 9, "topic": "Question 9", "question": "For the quadratic function $f(x) = 5x^2$, find and simplify the difference quotient $\\frac{f(x+h) - f(x)}{h}$ ($h \\neq 0$):", "options": ["10x + 5h", "5x + 5h", "10x", "5h"], "correct": 0, "solution": "$\\frac{5(x+h)^2 - 5x^2}{h} = \\frac{5(x^2 + 2xh + h^2) - 5x^2}{h} = \\frac{10xh + 5h^2}{h} = 10x + 5h$"}, {"id": 10, "topic": "Question 10", "question": "Identify the parent function and determine the equation of the transformed function $g(x)$ shown in the graph below:\n\n<div class=\"flex justify-center my-4 p-2 bg-white rounded-lg border border-gray-200 shadow-sm max-w-sm mx-auto\"><!-- This file was generated by dvisvgm 3.4.3 -->\n<svg version='1.1' xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink' width='169.801pt' height='141.843pt' viewBox='0 -141.843 169.801 141.843'>\n<defs>\n<clipPath id='clip1'>\n<path d='M2.332031 2.332031H167.46845V139.51195H2.332031Z'/>\n</clipPath>\n</defs>\n<g id='page1'>\n<g transform='matrix(1 0 0 -1 0 0)'>\n<path d='M18.84374 2.332031V139.51195M35.35941 2.332031V139.51195M51.871085 2.332031V139.51195M68.386755 2.332031V139.51195M101.4141 2.332031V139.51195M117.9296 2.332031V139.51195M134.4417 2.332031V139.51195M150.9572 2.332031V139.51195' stroke='#bfbfbf' fill='none' stroke-width='.338725' stroke-miterlimit='10'/>\n<path d='M2.332031 17.57418H167.46845M2.332031 32.81638H167.46845M2.332031 48.05858H167.46845M2.332031 63.30078H167.46845M2.332031 9 tes:", "options": ["Minimum at (3, -5)", "Maximum at (3, -5)", "Minimum at (-3, 31)", "Maximum at (-3, -5)"], "correct": 0, "solution": "$a = 1 > 0 \\implies \\text{Min}$; $h = -\\frac{-6}{2(1)} = 3$, $k = 3^2 - 6(3) + 4 = -5 \\implies \\text{Minimum at } (3, -5)$"}, {"id": 14, "topic": "Question 14", "question": "Use the leading coefficient test to determine the end behavior of $g(x) = -4x^3 + 3x^2 - 2x + 1$:", "options": ["Falls to the left and rises to the right", "Rises to the left and falls to the right (\\text{As } x \\to -\\infty, g(x) \\to \\infty; \\text{ as } x \\to \\infty, g(x) \\to -\\infty)", "Rises to the left and rises to the right", "Falls to the left and falls to the right"], "correct": 1, "solution": "Degree 3 (odd), leading coeff $-4 < 0 \\implies x \\to -\\infty, g \\to \\infty; x \\to \\infty, g \\to -\\infty$"}, {"id": 15, "topic": "Question 15", "question": "Find all real zeros of $f(x) = 2(x + 4)(x - 1)^2$, state their multiplicities, and determine whether the graph crosses or touches the $x$-axis at each zero:", "options": ["Zero 4 (mult. 1, touches); Zero -1 (mult. 2, crosses)", "Zero -4 (mult. 1, touches); Zero 1 (mult. 2, crosses)", "Zero -4 (mult. 1, crosses); Zero 1 (mult. 2, touches)", "Zero 4 (mult. 1, crosses); Zero -1 (mult. 2, touches)"], "correct": 2, "solution": "Zero $-4$ (exp 1, crosses); Zero $1$ (exp 2, touches)"}, {"id": 16, "topic": "Question 16", "question": "Use long division to divide $(4x^2 + 23x + 18) \\div (x + 5)$:", "options": ["4x + 3 - \\frac{3}{x+5}", "4x - 3 + \\frac{3}{x+5}", "4x + 5 - \\frac{2}{x+5}", "4x + 3 + \\frac{3}{x+5}"], "correct": 3, "solution": "Division quotient is $4x + 3$ with remainder $3 \\implies 4x + 3 + \\frac{3}{x+5}$"}, {"id": 17, "topic": "Question 17", "question": "Use synthetic division to divide $(x^2 + 4x - 21) \\div (x + 7)$:", "options": ["x - 3", "x + 3", "x - 14", "x + 14"], "correct": 0, "solution": "Synthetic division with $-7$: $[1, 4, -21] \\to [1, -3, 0] \\implies x - 3$"}, {"id": 18, "topic": "Question 18", "question": "Given $f(x) = x^3 + 3x^2 - 4x - 12$, use synthetic division and the Remainder Theorem to evaluate $f(-2)$:", "options": ["-4", "0", "8", "-16"], "correct": 1, "solution": "Remainder Theorem: $f(-2) = (-2)^3 + 3(-2)^2 - 4(-2) - 12 = -8 + 12 + 8 - 12 = 0$"}, {"id": 19, "topic": "Question 19", "question": "Find a polynomial function $f(x)$ of degree 3 with zeros $2, 5, -1$ and leading coefficient $1$. Expand the product completely:", "options": ["f(x) = x^3 + 6x^2 + 3x - 10", "f(x) = x^3 - 7x^2 + 10x - 10", "f(x) = x^3 - 6x^2 + 3x + 10", "f(x) = x^3 - 6x^2 - 7x + 10"], "correct": 2, "solution": "$(x-2)(x-5)(x+1) = (x^2 - 7x + 10)(x + 1) = x^3 - 6x^2 + 3x + 10$"}, {"id": 20, "topic": "Question 20", "question": "List all possible rational zeros of $f(x) = 8x^4 - 3x^2 + 3$ using the Rational Zero Theorem:", "options": ["\\pm 1, \\pm 2, \\pm 4, \\pm 8, \\pm \\frac{1}{3}", "\\pm 1, \\pm 3, \\pm \\frac{1}{2}, \\pm \\frac{1}{4}, \\pm \\frac{1}{8}", "\\pm 1, \\pm 2, \\pm 3, \\pm \\frac{3}{8}", "\\pm 1, \\pm 3, \\pm \\frac{1}{2}, \\pm \\frac{3}{2}, \\pm \\frac{1}{4}, \\pm \\frac{3}{4}, \\pm \\frac{1}{8}, \\pm \\frac{3}{8}"], "correct": 3, "solution": "Factors of $p=3$: $\\pm 1, \\pm 3$; Factors of $q=8$: $\\pm 1, \\pm 2, \\pm 4, \\pm 8 \\implies \\pm 1, \\pm 3, \\pm \\frac{1}{2}, \\dots$"}, {"id": 21, "topic": "Question 21", "question": "<em>[Cumulative -- Linear Equations]</em> Solve the linear equation for $x$: &nbsp;&nbsp;&nbsp;&nbsp; $5(2x - 1) - 2(x + 4) = 4(2x - 3) - 1$", "options": ["All real numbers", "No solution", "x = 0", "x = 5"], "correct": 0, "solution": "$10x - 5 - 2x - 8 = 8x - 12 - 1 \\implies 8x - 13 = 8x - 13 \\implies \\text{All real numbers}$"}, {"id": 22, "topic": "Question 22", "question": "<em>[Cumulative -- Equations of Lines]</em> Find the slope-intercept form ($y = mx + b$) of the line passing through $(-4, 11)$ and $(2, -7)$:", "options": ["y = 3x + 23", "y = -3x - 1", "y = -\\frac{1}{3}x + \\frac{29}{3}", "y = -3x + 1"], "correct": 1, "solution": "$m = \\frac{-7 - 11}{2 - (-4)} = \\frac{-18}{6} = -3$; $y - 11 = -3(x + 4) \\implies y = -3x - 1$"}, {"id": 23, "topic": "Question 23", "question": "<em>[Cumulative -- Quadratic Equations]</em> Solve the quadratic equation by factoring or using the quadratic formula: &nbsp;&nbsp;&nbsp;&nbsp; $4x^2 - 11x - 3 = 0$", "options": ["\\left\\{\\frac{1}{4}, -3\\right\\}", "\\left\\{-3, \\frac{1}{4}\\right\\}", "\\left\\{-\\frac{1}{4}, 3\\right\\}", "\\left\\{4, -\\frac{3}{4}\\right\\}"], "correct": 2, "solution": "$(4x + 1)(x - 3) = 0 \\implies x = -\\frac{1}{4}$ or $x = 3$"}, {"id": 24, "topic": "Question 24", "question": "<em>[Cumulative -- Absolute Value Inequalities]</em> Solve the absolute value inequality and express in interval notation: &nbsp;&nbsp;&nbsp;&nbsp; $|4x - 3| + 5 \\le 18$", "options": ["\\left(-\\infty, -\\frac{5}{2}\\right] \\cup \\left[4, \\infty\\right)", "\\left[-4, \\frac{5}{2}\\right]", "\\left[-\\frac{5}{2}, \\frac{13}{4}\\right]", "\\left[-\\frac{5}{2}, 4\\right]"], "correct": 3, "solution": "$|4x - 3| \\le 13 \\implies -13 \\le 4x - 3 \\le 13 \\implies -10 \\le 4x \\le 16 \\implies \\left[-\\frac{5}{2}, 4\\right]$"}, {"id": 25, "topic": "Question 25", "question": "<em>[Cumulative -- Circle Equations]</em> Complete the square to determine the center and radius of the circle: &nbsp;&nbsp;&nbsp;&nbsp; $x^2 + y^2 - 10x + 4y - 7 = 0$", "options": ["Center: (-5, 2), Radius: 36", "Center: (5, -2), Radius: 36", "Center: (5, -2), Radius: 6", "Center: (-5, 2), Radius: 6"], "correct": 2, "solution": "$(x^2 - 10x + 25) + (y^2 + 4y + 4) = 7 + 25 + 4 = 36 \\implies \\text{Center } (5, -2), \\text{ Radius } r = 6$"}]}};
    let currentExamKey = Object.keys(EXAM_DATA)[0] || null;

    function renderSidebar() {
      const nav = document.getElementById('exam-nav');
      nav.innerHTML = '';
      Object.keys(EXAM_DATA).forEach(key => {
        const exam = EXAM_DATA[key];
        const a = document.createElement('a');
        a.href = "#";
        a.className = `block px-3 py-2 text-sm font-medium rounded-md transition ${key === currentExamKey ? 'bg-blue-900 text-white' : 'text-gray-700 hover:bg-gray-150'}`;
        a.innerText = exam.title;
        a.onclick = (e) => {
          e.preventDefault();
          currentExamKey = key;
          renderSidebar();
          renderExam();
        };
        nav.appendChild(a);
      });
    }

    function renderExam() {
      const container = document.getElementById('questions-container');
      const titleEl = document.getElementById('exam-title');
      
      if (!currentExamKey || !EXAM_DATA[currentExamKey]) {
        container.innerHTML = '<div class="text-gray-500">No exam selected.</div>';
        return;
      }

      const exam = EXAM_DATA[currentExamKey];
      titleEl.innerText = exam.title;
      container.innerHTML = '';

      exam.questions.forEach((q) => {
        const card = document.createElement('div');
        card.className = "bg-white p-6 rounded-lg shadow-sm border border-gray-200 space-y-4";
        card.innerHTML = `
          <div class="flex justify-between items-center border-b border-gray-100 pb-3">
            <span class="font-bold text-blue-900 text-lg">Question ${q.id}</span>
            <span class="text-xs bg-gray-100 text-gray-600 px-2.5 py-1 rounded-full font-medium">${q.topic}</span>
          </div>
          <div class="text-gray-800 leading-relaxed">${q.question}</div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-2">
            ${q.options.map((opt, i) => `
              <button onclick="checkAnswer(${q.id}, ${i}, ${q.correct})" id="opt-${q.id}-${i}" 
                class="text-left p-3 border border-gray-200 rounded-md hover:border-blue-500 hover:bg-blue-50 transition text-sm">
                <span class="font-bold mr-2">${String.fromCharCode(65 + i)}.</span> $${opt}$
              </button>
            `).join('')}
          </div>
          <div class="pt-3 border-t border-gray-100 flex justify-between items-center">
            <button onclick="toggleSolution(${q.id})" class="text-xs font-semibold text-blue-700 hover:underline">
              View Explanation
            </button>
            <span id="feedback-${q.id}" class="text-sm font-bold"></span>
          </div>
          <div id="solution-${q.id}" class="hidden p-4 bg-blue-50 border border-blue-100 rounded-md text-sm text-blue-950">
            <div class="font-bold text-xs uppercase tracking-wider text-blue-800 mb-1">Explanation</div>
            <div>${q.solution}</div>
          </div>
        `;
        container.appendChild(card);
      });

      if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise();
      }
    }

    function checkAnswer(qId, selectedIdx, correctIdx) {
      const feedback = document.getElementById(`feedback-${qId}`);
      for (let i = 0; i < 4; i++) {
        const btn = document.getElementById(`opt-${qId}-${i}`);
        if (btn) btn.classList.remove('bg-green-100', 'border-green-500', 'bg-red-100', 'border-red-500');
      }

      const selectedBtn = document.getElementById(`opt-${qId}-${selectedIdx}`);
      if (selectedIdx === correctIdx) {
        selectedBtn.classList.add('bg-green-100', 'border-green-500');
        feedback.className = "text-sm font-bold text-green-600";
        feedback.innerText = "✓ Correct!";
      } else {
        selectedBtn.classList.add('bg-red-100', 'border-red-500');
        feedback.className = "text-sm font-bold text-red-600";
        feedback.innerText = "✗ Try Again";
      }
    }

    function toggleSolution(qId) {
      const sol = document.getElementById(`solution-${qId}`);
      if (sol) sol.classList.toggle('hidden');
    }
